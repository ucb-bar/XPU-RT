description: |
  Google/Meta XNNPACK (UCB-BAR fork at branch torch-1.0.0-bump) — fast
  NHWC microkernels for CPU operator execution. Covers f32 / f16 /
  qs8 / qu8 / qd8→f32 paths for conv2d, depthwise conv, fully-
  connected, batch-matmul, average/max pool, softmax, unary
  (relu/sigmoid/tanh/hswish/gelu/...), binary (add/mul/sub/...),
  reductions, transpose, resize-bilinear, prelu, leaky-relu, and
  static-slice.

  Architecture: the provider emits a small C source per dispatch that
  calls libxpu_rt's stable xnnpack_bridge ABI (declared in
  runtime/native/libxpu_rt/src/drivers/xnnpack/xnnpack_bridge.h). The
  bridge translates each call to xnn_create_<op>_* + xnn_reshape_* +
  xnn_setup_* + xnn_run_operator. Kernels execute through libxpu_rt's
  cpu_task driver, same as every other CPU artifact.

  Runtime requirement: libxpu_rt must be built with
  -DXPURT_WITH_XNNPACK=ON. Without that flag the bridge symbols stub
  to -XPU_RT_XNN_ENOTSUP and this provider's probe() reports
  blocked_reason=build_flag_missing.

  Layout: XNNPACK is NHWC-only for spatial ops; can_bid() declines
  non-NHWC contracts with blocked_reason=requires_nhwc_layout so the
  layout-normalisation pass can insert transposes and re-bid.
