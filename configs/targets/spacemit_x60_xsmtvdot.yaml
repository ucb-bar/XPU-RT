schema_version: graphcomp_target_config_v1
target_id: spacemit_x60_xsmtvdot
device_kind: cpu
description: |
  SpaceMiT X60 — 8-core RISC-V 64-bit application processor with the
  XSmtVDot custom dot-product extension (RVV 1.0 + xsmtvdot). Used by
  merlin to accelerate int8/bf16 GEMM and convolutions. Numbers below
  are vendor-published peak figures — real latency comes from on-board
  profiling.

peak_compute_gflops: 32.0
peak_bandwidth_gb_s: 8.0
memory_tiers:
  scratchpad_bytes: 0
  l2_bytes: 1048576
  l3_bytes: 0
  system_bytes: 4294967296
supported_dtypes:
  - i8
  - bf16
  - fp32
numerical_budgets:
  i8: 1.0e-2
  bf16: 1.0e-2
  fp32: 1.0e-3
peak_compute_per_dtype:
  i8: 32.0
  bf16: 16.0
  fp32: 4.0
mma_shapes: {}
codegen_hints:
  - "RVV 1.0 + xsmtvdot — dot-product intrinsics for int8/bf16"
  - "merlin lowers via spacemit-specific LLVM patterns"

working_set_tiles:
  matmul:
    - { M: 16, N: 16, K: 32 }
    - { M: 32, N: 32, K: 32 }
  elementwise:
    - { numel: 256 }
    - { numel: 1024 }

merlin:
  target: spacemit_x60
  spec_dir: target_specs/examples/spacemit_x60_xsmtvdot
  simulator: null
