schema_version: graphcomp_target_config_v1
target_id: gemmini_mx
device_kind: custom_accelerator
# Knowledge card path (per-target ISA + intrinsics + lessons memory).
# Populated by `xpu-rt-target seed gemmini` or the /xpu-rt-target skill.
knowledge_card: .xpu_rt/knowledge/targets/gemmini_mx/target_card.json
description: |
  Gemmini MX (mixed-precision) — systolic matrix accelerator with
  explicit scratchpad + accumulator state. Compiled via merlin's
  tools/compile.py (target=gemmini_mx); measured under FireSim.
  Placeholder budgets below; replace with measured numbers when
  FireSim profiling lands.

peak_compute_gflops: 128.0
peak_bandwidth_gb_s: 25.6
memory_tiers:
  scratchpad_bytes: 262144
  l2_bytes: 524288
  l3_bytes: 0
  system_bytes: 268435456
supported_dtypes:
  - i8
  - bf16
  - i32
  - fp32
numerical_budgets:
  i8: 1.0e-2
  bf16: 1.0e-2
  fp32: 1.0e-3
peak_compute_per_dtype:
  i8: 128.0
  bf16: 64.0
  fp32: 8.0
mma_shapes:
  - { M: 16, N: 16, K: 16 }
  - { M: 32, N: 16, K: 32 }
codegen_hints:
  - "systolic array; ROW major LHS, COL major RHS preferred"
  - "explicit scratchpad — kernel must DMA inputs before mvin"
  - "merlin emits gemmini ISA via custom RoCC encodings"

working_set_tiles:
  matmul:
    - { M: 16, N: 16, K: 16 }
    - { M: 32, N: 32, K: 32 }
    - { M: 64, N: 64, K: 32 }
  elementwise:
    - { numel: 256 }
    - { numel: 1024 }

merlin:
  target: gemmini_mx
  spec_dir: target_specs/examples/gemmini_mx
  simulator: firesim
