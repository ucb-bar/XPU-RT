site_name: XPU-RT
site_description: >-
  XPU-RT is an end-to-end compilation, scheduling, and runtime flow for
  efficient mapping of robotic and AI workloads onto heterogeneous SoCs —
  combining an LLM-driven compiler generator (formerly CompGen) with a
  CVX/MILP-based two-cluster scheduler and a native C/CUDA runtime.
site_url: https://ucb-bar.github.io/XPU-RT/
repo_url: https://github.com/ucb-bar/XPU-RT
repo_name: ucb-bar/XPU-RT
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/xpu-rt-logo.svg
  favicon: assets/xpu-rt-logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - fenced_code
  - tables
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - toc:
      permalink: true

